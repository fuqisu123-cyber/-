version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: dropshipping-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dropshipping_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dropshipping-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropshipping-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: dropshipping_platform
      JWT_SECRET: your-secret-key-here
      JWT_EXPIRATION: 24h
      NODE_ENV: development
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dropshipping-network
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dropshipping-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
      VITE_APP_TITLE: 无货源电商管理平台
    depends_on:
      - backend
    networks:
      - dropshipping-network
    volumes:
      - ./frontend/src:/app/src

volumes:
  mysql_data:

networks:
  dropshipping-network:
    driver: bridge
